[package]
name = "cargo-upkeep"
version = "0.3.14"
edition = "2021"
description = "Unified Rust project maintenance CLI (cargo subcommand)"
repository = "https://github.com/llbbl/upkeep-rs"
homepage = "https://github.com/llbbl/upkeep-rs"
documentation = "https://docs.rs/cargo-upkeep"
keywords = ["cargo", "cargo-subcommand", "dependencies", "security", "maintenance"]
categories = ["development-tools::cargo-plugins", "command-line-utilities"]
readme = "README.md"
license = "MIT"
rust-version = "1.96"
# The test advisory-db fixture carries a deliberately fabricated advisory so an
# integration test can prove `UPKEEP_ADVISORY_DB` was honoured. It is clearly
# labelled as fake, but a published crate has no business shipping a document
# that asserts a security advisory against somebody else's crate, so it stays
# out of the package. See #19 for excluding dev-only files more broadly.
exclude = ["tests/fixtures/**"]

[[bin]]
name = "cargo-upkeep"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
cargo_metadata = "0.23"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rustsec = "0.33"
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.0", features = ["rt-multi-thread", "macros", "process"] }
toml = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
assert_cmd = "2.0"
httpmock = "0.8"
predicates = "3.0"
tempfile = "3.0"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/cargo-upkeep-{ target }.tar.gz"
pkg-fmt = "tgz"
bin-dir = "."

[[package.metadata.binstall.overrides]]
target = "x86_64-pc-windows-msvc"
pkg-url = "{ repo }/releases/download/v{ version }/cargo-upkeep-{ target }.zip"
pkg-fmt = "zip"
bin-dir = "."
